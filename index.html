<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cybersecurity services | Stay ahead of every threat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--deep:#020a22;--ink:#f4f8ff;--mute:#b9d3ee;--amber:#ff9a1f;--link:#0f4fae;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--deep);color:var(--ink);font-family:Barlow,system-ui,-apple-system,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.hero{position:relative;height:540px;display:flex;align-items:center;padding:3.5rem clamp(1.25rem,6vw,5rem) 2rem;background:linear-gradient(115deg,#020a22 0%,#031a47 38%,#06508f 72%,#14c4e4 100%);overflow:hidden}
#code,#particles-js,#cv{position:absolute;inset:0;width:100%;height:100%}
#code{z-index:1;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.3) 0%,#000 38%,#000 55%,transparent 82%);mask-image:linear-gradient(90deg,rgba(0,0,0,.3) 0%,#000 38%,#000 55%,transparent 82%)}
#particles-js{z-index:2}
#cv{z-index:3;pointer-events:none}
nav.crumb{position:absolute;top:1rem;left:clamp(1.25rem,6vw,5rem);z-index:4;display:flex;flex-wrap:wrap;gap:.5rem;font-size:.95rem;color:var(--mute)}
nav.crumb a{color:inherit;text-decoration:none}
nav.crumb a:hover{color:#fff}
nav.crumb a:focus-visible,.btn:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:2px}
nav.crumb b{color:#fff;font-weight:500}
.copy{position:relative;z-index:4;max-width:480px;animation:rise .9s .2s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(2.6rem,6vw,4.4rem);line-height:1;color:#fff;text-shadow:0 2px 18px rgba(2,10,34,.8)}
.copy p{margin-top:1rem;font-size:1.1rem;line-height:1.5;color:#d3e6f8;max-width:40ch;text-shadow:0 1px 12px rgba(2,10,34,.9)}
.cta{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.6rem}
.btn{display:inline-block;padding:.8rem 1.4rem;border-radius:4px;font-weight:500;text-decoration:none;transition:background .2s,border-color .2s}
.btn.p{background:var(--amber);color:#1a1205}
.btn.p:hover{background:#ffb04d}
.btn.s{border:1px solid rgba(190,230,255,.55);color:#fff;background:rgba(2,10,34,.35)}
.btn.s:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.ticker-track-container{position:relative;z-index:5;width:100%;height:68px;overflow:hidden;display:flex;align-items:center;background:#fff;color:#0a2e6e;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(1.1rem,2vw,1.5rem);letter-spacing:.06em}
.ticker-track{display:flex;width:max-content;align-items:center;white-space:nowrap;will-change:transform;animation:slide var(--dur,60s) linear infinite}
.ticker-track-container:hover .ticker-track,.ticker-track-container:focus-within .ticker-track{animation-play-state:paused}
@keyframes slide{to{transform:translate3d(calc(-1 * var(--dist,1000px)),0,0)}}
.ticker-group{display:flex;align-items:center;flex-shrink:0;gap:1.6rem;padding-right:1.6rem}
.ticker-group a{color:inherit;text-decoration:none;padding:.1rem .15rem;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.ticker-group a:hover{color:var(--link);border-color:var(--link)}
.ticker-group a:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.ticker-group svg{width:1.25em;height:1.25em;flex-shrink:0;color:var(--link)}
@media(max-width:1200px){.hero{height:520px}.ticker-track-container{height:64px}}
@media(max-width:767.98px){.hero{height:auto;min-height:640px;align-items:flex-end;padding:3rem 1.25rem 1.8rem;background:linear-gradient(180deg,#14a9d0 0%,#06508f 32%,#031a47 62%,#020a22 100%)}#code{opacity:.4;-webkit-mask-image:none;mask-image:none}.ticker-track-container{height:58px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important}.ticker-track{animation:none!important}.ticker-track-container{overflow-x:auto}}
</style>
</head>
<body>
<section class="hero" id="hero">
  <canvas id="code" aria-hidden="true"></canvas>
  <div id="particles-js" aria-hidden="true"></div>
  <canvas id="cv" aria-hidden="true"></canvas>
  <nav class="crumb" aria-label="Breadcrumb">
    <a href="#">Home</a><span aria-hidden="true">&gt;</span>
    <a href="#">Services</a><span aria-hidden="true">&gt;</span>
    <b>Cybersecurity services</b>
  </nav>
  <div class="copy">
    <h1>Stay ahead of every threat.</h1>
    <p>Risk assessment, penetration testing, incident response and compliance, delivered by certified security experts.</p>
  </div>
</section>
<div class="ticker-track-container" id="identity" aria-label="Our cybersecurity services">
  <div class="ticker-track" id="ticker-track"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function pauseParticles(){(window.pJSDom||[]).forEach(d=>{if(d&&d.pJS&&d.pJS.fn.drawAnimFrame){(window.cancelRequestAnimFrame||cancelAnimationFrame)(d.pJS.fn.drawAnimFrame);d.pJS.fn.drawAnimFrame=null}})}
function resumeParticles(){if(RM)return;(window.pJSDom||[]).forEach(d=>{if(d&&d.pJS&&!d.pJS.fn.drawAnimFrame&&d.pJS.particles.move.enable)d.pJS.fn.drawAnimFrame=(window.requestAnimFrame||requestAnimationFrame)(d.pJS.fn.vendors.draw)})}
const ParticleManager={
  tier:null,
  getTier(){const w=innerWidth;return w>1200?'desktop':w>=768?'tablet':'mobile'},
  getConfig(){
    const w=innerWidth,hover=!RM&&matchMedia('(hover: hover)').matches&&w>=768;
    return{particles:{
      number:{value:w<768?12:w<=1200?20:28,density:{enable:true,value_area:w<768?800:900}},
      color:{value:['#ffffff','#7fe6ff','#ff9a1f']},shape:{type:'circle'},opacity:{value:0.45},size:{value:2.5,random:true},
      line_linked:{enable:w>=480,distance:w<768?80:w<=1200?100:120,color:'#9fe8ff',opacity:0.25,width:1},
      move:{enable:!RM,speed:RM?0:(w<768?1.1:1.5),direction:'none',out_mode:'out'}},
      interactivity:{detect_on:'canvas',events:{onhover:{enable:hover,mode:'repulse'},onclick:{enable:false},resize:false},modes:{repulse:{distance:160,duration:0.4}}},
      retina_detect:false};
  },
  init(force){
    const tier=this.getTier();
    if(!force&&tier===this.tier)return;
    this.tier=tier;
    try{pauseParticles();window.pJSDom=[];document.getElementById('particles-js').innerHTML='';particlesJS('particles-js',this.getConfig())}
    catch(e){console.warn('particles init skipped',e)}
  },
  onResize(){
    if(this.getTier()!==this.tier){this.init(true);return}
    const d=window.pJSDom&&window.pJSDom[0];
    if(d&&d.pJS&&d.pJS.canvas.el){const c=d.pJS.canvas,w=c.el.offsetWidth,h=c.el.offsetHeight;if(w!==c.w||h!==c.h){c.w=w;c.h=h;c.el.width=w;c.el.height=h}}
  }
};

const CODE=['import socket, ssl, sys','from scanner import Target, Finding','','# operator classes','def scan_ports(host, ports):','    open_ports = []','    for p in ports:','        s = socket.socket()','        s.settimeout(0.4)','        if s.connect_ex((host, p)) == 0:','            open_ports.append(p)','    return open_ports','','def check_tls(host):','    ctx = ssl.create_default_context()','    sock = ctx.wrap_socket(socket.socket(), server_hostname=host)','    if sock.version() in ("TLSv1", "TLSv1.1"):','        return Finding("weak_tls", severity="high")','','def audit(target):','    findings = []','    findings += scan_ports(target.host, target.ports)','    findings += check_tls(target.host)','    report.add(target, findings)','    print("please select exactly one target")','    return len(findings) == 0'];
const CODEC=CODE.map(l=>/^\s*#/.test(l)?'#5fb4dd':/^\s*(def|import|from|for|if|return)\b/.test(l)?'#ffb04d':/print|Finding/.test(l)?'#7dffd6':'#c4ecff');
const ARCS=[[40.7,-74,51.5,-0.1,0],[35.7,139.7,1.3,103.8,1],[-23.5,-46.6,6.5,3.4,0],[25.2,55.3,52.5,13.4,1],[19,72.8,-33.9,151.2,0]];

class HeroCanvas{
  constructor(cv,code,hero){
    this.cv=cv;this.ctx=cv.getContext('2d');this.code=code;this.cc=code.getContext('2d');this.hero=hero;
    this.raf=null;this.running=false;this.visible=true;this.last=0;this.fps=30;this.interval=1000/30;
    this.t0=performance.now();this.bound=this.frame.bind(this);this.q=[0,0,0];this.TILT=0.35;
    const L=[],O=[],D=Math.PI/180;
    const land=(a,o)=>Math.sin(o*1.7+0.8)*Math.cos(a*1.3)+0.7*Math.sin(o*3.1-a*2.2+1.3)*Math.cos(a)+0.5*Math.sin(a*4+o*0.9)>0.35;
    const vec=(a,o)=>{const cl=Math.cos(a);return[cl*Math.sin(o),Math.sin(a),cl*Math.cos(o)]};
    for(let la=-84;la<=84;la+=2.6){
      const a=la*D,step=2.6/Math.max(0.25,Math.cos(a));
      for(let lo=0;lo<360;lo+=step){const o=lo*D-Math.PI;if(land(a,o))L.push(...vec(a,o))}
    }
    for(let la=-80;la<=80;la+=6){
      const a=la*D,step=6/Math.max(0.25,Math.cos(a));
      for(let lo=0;lo<360;lo+=step){const o=lo*D-Math.PI;if(!land(a,o))O.push(...vec(a,o))}
    }
    this.land=new Float32Array(L);this.ocean=new Float32Array(O);
    this.arcs=ARCS.map(r=>({a:vec(r[0]*D,r[1]*D),b:vec(r[2]*D,r[3]*D),amb:r[4]}));
  }
  resize(){
    const mob=innerWidth<768;
    this.fps=mob?22:innerWidth<=1200?26:30;this.interval=1000/this.fps;
    this.dpr=Math.min(devicePixelRatio||1,mob?1.25:1.5);
    this.W=this.hero.clientWidth;this.H=this.hero.clientHeight;
    [this.cv,this.code].forEach(c=>{c.width=Math.round(this.W*this.dpr);c.height=Math.round(this.H*this.dpr)});
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);this.cc.setTransform(this.dpr,0,0,this.dpr,0,0);
    if(RM)this.render(this.t0+10000);
  }
  drawCode(t){
    const c=this.cc,H=this.H,lh=24,N=CODE.length,sc=RM?0:t*16;
    c.clearRect(0,0,this.W,H);
    const rows=Math.ceil(H/lh)+8,base=Math.floor(sc/lh),off=sc%lh;
    c.save();c.translate(0,H*.5);c.rotate(-.09);c.translate(0,-H*.5);
    for(let r=0;r<rows;r++){
      const y=r*lh-off-80,k=Math.min(1,Math.max(0,y/H)),i=(r+base)%N;
      c.font=`${(12*(.8+k*.6)).toFixed(1)}px ui-monospace,Menlo,Consolas,monospace`;
      c.globalAlpha=.3+.5*Math.min(1,k+.2);
      c.fillStyle=CODEC[i];
      c.fillText(CODE[i],16,y);
    }
    c.restore();
  }
  pr(v,cx,cy,R,rc,rs,ct,st,s){
    const x=v[0]*rc+v[2]*rs,z=-v[0]*rs+v[2]*rc,q=this.q;
    q[0]=cx+x*R*s;q[1]=cy-(v[1]*ct-z*st)*R*s;q[2]=v[1]*st+z*ct;
  }
  dots(arr,cx,cy,R,rc,rs,ct,st,ds,lo,hi,a){
    const c=this.ctx;
    c.fillStyle=a;c.beginPath();
    for(let i=0;i<arr.length;i+=3){
      const x=arr[i]*rc+arr[i+2]*rs,z=-arr[i]*rs+arr[i+2]*rc,pz=arr[i+1]*st+z*ct;
      if(pz<=lo||pz>hi)continue;
      const s=ds*(.8+pz*1.2);
      c.rect(cx+x*R-s/2,cy-(arr[i+1]*ct-z*st)*R-s/2,s,s);
    }
    c.fill();
  }
  render(now){
    const c=this.ctx,W=this.W,H=this.H,t=(now-this.t0)/1000;
    c.clearRect(0,0,W,H);
    this.drawCode(t);
    const mob=W<768,e=RM?1:1-Math.pow(1-Math.min(1,t/1.4),3);
    const cx=mob?W*.5:W*(W<1000?.82:.78),cy=mob?H*.3:H*.5;
    const R=(mob?Math.min(W*.3,H*.22):Math.min(H*.46,W*.27))*e;
    if(R<3)return;
    const rot=RM?0:t*.1,rc=Math.cos(rot),rs=Math.sin(rot),ct=Math.cos(this.TILT),st=Math.sin(this.TILT);
    const gl=c.createRadialGradient(cx,cy,R*.9,cx,cy,R*1.35);
    gl.addColorStop(0,'rgba(90,235,255,.5)');gl.addColorStop(1,'rgba(90,235,255,0)');
    c.fillStyle=gl;c.beginPath();c.arc(cx,cy,R*1.35,0,6.283);c.fill();
    const bg=c.createRadialGradient(cx-R*.3,cy-R*.3,R*.1,cx,cy,R);
    bg.addColorStop(0,'rgba(40,170,230,.35)');bg.addColorStop(1,'rgba(5,60,120,.35)');
    c.fillStyle=bg;c.beginPath();c.arc(cx,cy,R,0,6.283);c.fill();
    const ds=Math.max(1.3,R/140);
    this.dots(this.ocean,cx,cy,R,rc,rs,ct,st,ds*.8,0,1,'rgba(90,200,240,.3)');
    this.dots(this.land,cx,cy,R,rc,rs,ct,st,ds,0,.4,'rgba(110,225,255,.55)');
    this.dots(this.land,cx,cy,R,rc,rs,ct,st,ds,.4,1,'rgba(200,250,255,.95)');
    c.save();c.lineWidth=1.4;c.lineCap='round';
    this.arcs.forEach((r,i)=>{
      const q=this.q;
      this.pr(r.a,cx,cy,R,rc,rs,ct,st,1);const ax=q[0],ay=q[1],az=q[2];
      this.pr(r.b,cx,cy,R,rc,rs,ct,st,1);const bx=q[0],by=q[1],bz=q[2];
      if(az<.05||bz<.05)return;
      const m=[r.a[0]+r.b[0],r.a[1]+r.b[1],r.a[2]+r.b[2]],l=Math.hypot(m[0],m[1],m[2])||1;
      this.pr([m[0]/l,m[1]/l,m[2]/l],cx,cy,R,rc,rs,ct,st,1.45);
      const kx=q[0],ky=q[1],col=r.amb?'255,154,31':'170,245,255';
      c.strokeStyle=`rgba(${col},.65)`;c.beginPath();c.moveTo(ax,ay);c.quadraticCurveTo(kx,ky,bx,by);c.stroke();
      const p=RM?.5:(t*.22+i*.31)%1,u=1-p;
      c.fillStyle=`rgba(${col},1)`;c.shadowColor=`rgba(${col},1)`;c.shadowBlur=8;
      c.beginPath();c.arc(u*u*ax+2*u*p*kx+p*p*bx,u*u*ay+2*u*p*ky+p*p*by,2.4,0,6.283);c.fill();c.shadowBlur=0;
      c.beginPath();c.arc(ax,ay,2,0,6.283);c.arc(bx,by,2,0,6.283);c.fill();
    });
    c.restore();
    c.save();c.strokeStyle='rgba(180,250,255,.7)';c.lineWidth=1.5;c.shadowColor='rgba(120,240,255,.9)';c.shadowBlur=14;
    c.beginPath();c.arc(cx,cy,R,0,6.283);c.stroke();c.restore();
  }
  frame(now){
    if(!this.running)return;
    this.raf=requestAnimationFrame(this.bound);
    const d=now-this.last;
    if(d<this.interval)return;
    this.last=now-(d%this.interval);
    this.render(now);
  }
  start(){
    if(RM){this.render(this.t0+10000);return}
    if(this.running)return;
    this.running=true;this.last=performance.now();this.raf=requestAnimationFrame(this.bound);
  }
  pause(){this.running=false;if(this.raf){cancelAnimationFrame(this.raf);this.raf=null}}
  setVisible(v){if(this.visible===v)return;this.visible=v;v&&!document.hidden?this.start():this.pause()}
}

(function(){
  const SERVICES=['Risk Assessment','Penetration Testing','Vulnerability Assessment','Code Review','Incident Handling &amp; Forensics','Configuration Review','Approved Scanning Vendor (ASV)','Security Awareness'];
  const SHIELD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.1 8.2 7.5 10 4.4-1.8 7.5-5.4 7.5-10v-6z"/><path d="m8.7 12 2.5 2.5 4.2-4.8"/></svg>';
  const seq=SERVICES.map(s=>`<a href="#">${s}</a>${SHIELD}`).join('');
  let lastW=0,ready=false;
  function setMetrics(g){
    const tr=document.getElementById('ticker-track'),w=g.getBoundingClientRect().width;
    tr.style.setProperty('--dist',w.toFixed(2)+'px');tr.style.setProperty('--dur',(w/35).toFixed(2)+'s');
  }
  function buildMarquee(force){
    const box=document.getElementById('identity'),tr=document.getElementById('ticker-track'),cw=box.clientWidth||innerWidth;
    if(!force&&ready&&Math.abs(cw-lastW)<2)return;
    lastW=cw;tr.innerHTML='';
    const g1=document.createElement('div');g1.className='ticker-group';g1.innerHTML=seq;tr.appendChild(g1);
    let n=1;
    while(g1.getBoundingClientRect().width<cw*1.15&&n<10){g1.insertAdjacentHTML('beforeend',seq);n++}
    const g2=g1.cloneNode(true);g2.setAttribute('aria-hidden','true');g2.querySelectorAll('a').forEach(a=>a.tabIndex=-1);tr.appendChild(g2);
    setMetrics(g1);ready=true;
  }
  buildMarquee(true);
  const hero=document.getElementById('hero');
  const engine=new HeroCanvas(document.getElementById('cv'),document.getElementById('code'),hero);
  engine.resize();engine.start();
  ParticleManager.init(true);
  if(document.fonts&&document.fonts.ready){
    document.fonts.ready.then(()=>{const t=document.getElementById('ticker-track');if(t.children.length>=2)setMetrics(t.children[0])});
  }
  let rz=null;
  addEventListener('resize',()=>{
    if(rz)cancelAnimationFrame(rz);
    rz=requestAnimationFrame(()=>{engine.resize();ParticleManager.onResize();buildMarquee(false)});
  },{passive:true});
  if('IntersectionObserver' in window){
    let lastVis=null;
    new IntersectionObserver(es=>{
      const en=es[es.length-1],v=en.isIntersecting&&en.intersectionRatio>0.05;
      if(v===lastVis)return;
      lastVis=v;engine.setVisible(v);
      v?(!RM&&!document.hidden&&resumeParticles()):pauseParticles();
    },{threshold:[0,0.05,0.1]}).observe(hero);
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){engine.pause();pauseParticles()}
    else if(engine.visible&&!RM){engine.start();resumeParticles()}
  });
})();
</script>
</body>
</html>
